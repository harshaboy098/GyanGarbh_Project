<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Partner Login | Gyan Garbh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --brand-blue: #1e3c72; --brand-gold: #ffc107; }
        body { background: #f4f7fb; min-height: 100vh; display: flex; align-items: center; font-family: 'Segoe UI', sans-serif; }
        .auth-card { max-width: 450px; width: 100%; margin: auto; background: white; border-radius: 30px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .brand-logo { color: var(--brand-blue); font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 30px; }
        .form-control { border-radius: 12px; border: 2px solid #edf2f7; padding: 12px; transition: 0.3s; }
        .form-control:focus { border-color: var(--brand-blue); box-shadow: none; }
        .btn-auth { background: var(--brand-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn-auth:hover { background: #152d56; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(30,60,114,0.2); }
        .pass-container { position: relative; }
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999; }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css">
</head>
<body>

<div class="container">
    <div class="auth-card">
        <div class="brand-logo">
            <i class="bi bi-building-fill-check text-warning"></i><br>
            GYAN GARBH
            <p class="small text-muted fw-normal mt-2" style="font-size: 0.9rem;">Partner Login Portal</p>
        </div>

        <form onsubmit="handleHotelLogin(event)">
            <div class="mb-3">
                <label class="small fw-bold text-muted text-uppercase mb-1">Owner Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0 rounded-start-3"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="hotelEmail" class="form-control" placeholder="partner@gmail.com" required>
                </div>
            </div>
            
            <div class="mb-2">
                <label class="small fw-bold text-muted text-uppercase mb-1">Password</label>
                <div class="pass-container">
                    <input type="password" id="hotelPass" class="form-control" placeholder="••••••••" minlength="8" required>
                    <i class="bi bi-eye-slash toggle-pass" onclick="togglePass(this)"></i>
                </div>
            </div>

            <div class="text-end mb-4">
                <a href="javascript:void(0)" onclick="handleHotelForgot()" class="small text-muted text-decoration-none">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn-auth shadow">SIGN IN TO PANEL</button>
            
            <p class="text-center mt-4 small text-muted">
                New partner? <a href="hotel-register.html" class="text-primary fw-bold text-decoration-none">Register Property</a>
            </p>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="api-client.js"></script>
<script>
    // 🌐 API base URL
    const API_URL = (window.GYAN_GARBH_API_URL || (window.location.origin && window.location.origin !== 'null' ? window.location.origin : '')).replace(/\/$/, '');

    function togglePass(icon) {
        const input = document.getElementById('hotelPass');
        if(input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        } else {
            input.type = 'password';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        }
    }

    // ⭐ FORGOT PASSWORD (OTP Trigger Local Server)
    async function handleHotelForgot() {
        const { value: email } = await Swal.fire({
            title: 'Partner Reset',
            text: 'Enter registered owner email:',
            input: 'email',
            showCancelButton: true,
            confirmButtonColor: '#1e3c72'
        });

        if (!email) return;

        try {
            const res = await fetch(`${API_URL}/api/send-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, isReset: true })
            });
            const data = await res.json();

            if (res.ok) {
                const { value: fv } = await Swal.fire({
                    title: 'Verify & Reset',
                    html: '<input id="otp-h" class="swal2-input" placeholder="Enter OTP"><input id="pass-h" type="password" class="swal2-input" placeholder="New Password">',
                    preConfirm: () => {
                        const otp = document.getElementById('otp-h').value;
                        const pass = document.getElementById('pass-h').value;
                        if (!otp || !pass) return Swal.showValidationMessage('Please complete both fields.');
                        return [otp, pass];
                    }
                });

                if (fv) {
                    const vRes = await fetch(`${API_URL}/api/verify-otp`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ email, otp: fv[0] })
                    });

                    if (vRes.ok) {
                        const verifyData = await vRes.json();
                        const rRes = await fetch(`${API_URL}/api/reset-password`, {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ email, newPassword: fv[1], userType: 'hotel', resetToken: verifyData.resetToken })
                        });
                        if(rRes.ok) Swal.fire('Success!', 'Password updated.', 'success');
                    } else { Swal.fire('Error', 'The OTP is invalid.', 'error'); }
                }
            } else { Swal.fire('Error', data.message, 'error'); }
        } catch (e) { Swal.fire('Error', 'The server is currently unavailable.', 'error'); }
    }

    // ⭐ LOGIN LOGIC (Connected to Local Server)
    async function handleHotelLogin(e) {
        e.preventDefault();
        const email = document.getElementById('hotelEmail').value;
        const password = document.getElementById('hotelPass').value;
        const btn = document.getElementById('loginBtn');
        
        btn.innerText = "Authenticating..."; btn.disabled = true;

        try {
            const res = await fetch(`${API_URL}/api/hotel-login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if(res.ok && data.success) {
                localStorage.setItem('hotelOwnerEmail', data.ownerEmail);
                localStorage.setItem('hotelName', data.hotelName);
                localStorage.setItem('userRole', 'hotel'); 
                localStorage.setItem('authToken', data.sessionToken);
                
                Swal.fire({ icon: 'success', title: 'Welcome!', text: 'Opening your dashboard...', timer: 1500, showConfirmButton: false });
                setTimeout(() => { window.location.href = "hotel-dashboard.html"; }, 1500);
            } else {
                Swal.fire('Login Failed', 'The email or password is incorrect.', 'error');
                btn.innerText = "SIGN IN TO PANEL"; btn.disabled = false;
            }
        } catch (err) {
            Swal.fire('Error', 'Unable to connect to the server.', 'error');
            btn.innerText = "SIGN IN TO PANEL"; btn.disabled = false;
        }
    }
</script>

    <script src="mobile-responsive.js"></script>
</body>
</html>
