<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyan Garbh | Login & Signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="api-client.js"></script>
    <script>
        const GOOGLE_CLIENT_ID = '47696856369-b8pck7a7n94fsp303ltmmh5qpk4a55dh.apps.googleusercontent.com';
        let googleClientInitialized = false;

        function initGoogleIdentity() {
            if (window.google && window.google.accounts && window.google.accounts.id && !googleClientInitialized) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse,
                    cancel_on_tap_outside: true
                });
                googleClientInitialized = true;
            }
        }

        function handleCredentialResponse(response) {
            if (!response || !response.credential) {
                Swal.fire('Error', 'Google authentication failed. Please try again.', 'error');
                return;
            }
            const idToken = response.credential;
            fetch(`${API_URL}/google-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken })
            })
                .then(res => res.json().then(data => ({ status: res.status, body: data })))
                .then(({ status, body }) => {
                    if (status >= 200 && status < 300) {
                        localStorage.setItem('userName', body.name);
                        localStorage.setItem('userId', body.userId || '');
                        localStorage.setItem('userEmail', body.email);
                        localStorage.setItem('userRole', body.role);
                        localStorage.setItem('googleLogin', 'true');
                        localStorage.setItem('authToken', body.sessionToken);
                        document.cookie = `authToken=${encodeURIComponent(body.sessionToken)}; path=/; secure; samesite=strict`;
                        window.userToken = body.sessionToken;
                        
                        // ⭐ CRITICAL ROUTING REFIX: willClose guarantees instantaneous redirection
                        Swal.fire({ 
                            icon: 'success', 
                            title: 'Welcome!', 
                            text: `Hello ${body.name}!`, 
                            timer: 1500, 
                            showConfirmButton: false,
                            willClose: () => {
                                if (body.role === 'mitra') window.location.href = 'mitra-dashboard.html';
                                else if (body.role === 'hotel') window.location.href = 'hotel-dashboard.html';
                                else window.location.href = 'hotel.html';
                            }
                        });
                    } else {
                        Swal.fire('Error', body.message || 'Google login failed.', 'error');
                    }
                })
                .catch(() => {
                    Swal.fire('Error', 'Server connection error during login.', 'error');
                });
        }

        window.addEventListener('load', initGoogleIdentity);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .navbar-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            display: inline-block;
            vertical-align: middle;
        }
        .user-menu-trigger {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.08);
            color: #111827;
            cursor: pointer;
            transition: background 0.2s ease;
            font-weight: 700;
        }
        .user-menu-trigger:hover { background: rgba(0,0,0,0.12); }
        .user-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 180px;
            background: white;
            color: #111827;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(15,23,42,0.18);
            overflow: hidden;
            display: none;
            z-index: 1200;
        }
        .user-menu-dropdown.show { display: block; }
        .user-menu-item {
            display: block;
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            color: #111827;
            text-align: left;
            text-decoration: none;
            background: white;
            border-bottom: 1px solid #eef2f7;
            cursor: pointer;
        }
        .user-menu-item:last-child { border-bottom: none; }
        .user-menu-item:hover { background: #f8fafc; }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const API_URL = window.GYAN_GARBH_API_URL || (['localhost', '127.0.0.1', '::1', ''].includes(window.location.hostname) ? 'http://localhost:5000' : 'https://gyangarbh-project.onrender.com');
    let selectedRole = 'guest';
    let otpResendTimer = null;
    let lastEmailForOTP = '';

    window.addEventListener('DOMContentLoaded', () => {
        ['logEmail', 'logPass', 'regName', 'regDOB', 'regEmail', 'regPhone', 'regVillage', 'regPinCode', 'regAddress', 'regHotelName', 'regPass', 'regOTPInput']
            .forEach((id) => {
                const input = document.getElementById(id);
                if (input) input.value = '';
            });
    });

    function togglePasswordVisibility(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + 'Icon');
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            field.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    function startOTPTimer() {
        let seconds = 30;
        const display = document.getElementById('otpTimerDisplay');
        const countSpan = document.getElementById('timerCount');
        const btn = document.getElementById('resendOtpBtn');
        
        display.style.display = 'block';
        btn.classList.add('hidden');
        countSpan.textContent = seconds;
        
        clearInterval(otpResendTimer);
        otpResendTimer = setInterval(() => {
            seconds--;
            countSpan.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(otpResendTimer);
                display.style.display = 'none';
                btn.classList.remove('hidden');
            }
        }, 1000);
    }

    async function resendOTP() {
        try {
            const res = await fetch(`${API_URL}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: lastEmailForOTP.trim().toLowerCase(), isReset: false })
            });
            const data = await res.json().catch(() => ({ success: false, message: 'Server returned an invalid response.' }));
            if (res.ok) {
                Swal.fire('Success', 'Verification code resent successfully.', 'success');
                startOTPTimer();
            } else {
                Swal.fire('Error', data.message || 'Failed to resend OTP.', 'error');
            }
        } catch (e) {
            Swal.fire('Connection Error', `Unable to connect to ${API_URL}. Please check backend status and try again.`, 'error');
        }
    }

    function showForm(type) {
        if (type === 'login') {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('btnLoginTab').className = "flex-1 py-3 text-center text-sm font-bold rounded-2xl transition-all duration-300 bg-amber-500 text-slate-900 shadow-sm";
            document.getElementById('btnSignupTab').className = "flex-1 py-3 text-center text-sm font-bold rounded-2xl transition-all duration-300 text-slate-500 hover:text-slate-800";
        } else {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('signupSection').style.display = 'block';
            document.getElementById('signupFormPart').style.display = 'block';
            document.getElementById('signupOTPPart').style.display = 'none';
            document.getElementById('btnSignupTab').className = "flex-1 py-3 text-center text-sm font-bold rounded-2xl transition-all duration-300 bg-amber-500 text-slate-900 shadow-sm";
            document.getElementById('btnLoginTab').className = "flex-1 py-3 text-center text-sm font-bold rounded-2xl transition-all duration-300 text-slate-500 hover:text-slate-800";
        }
    }

    function selectRole(role) {
        selectedRole = role;
        const guestBtn = document.getElementById('role-guest');
        const hotelBtn = document.getElementById('role-hotel');
        const hotelField = document.getElementById('hotelNameField');
        
        if (role === 'hotel') {
            hotelBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-slate-900 text-white";
            guestBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500";
            hotelField.classList.remove('hidden');
        } else {
            guestBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-slate-900 text-white";
            hotelBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500";
            hotelField.classList.add('hidden');
        }
    }

    async function handleForgotPassword() {
        const { value: email } = await Swal.fire({
            title: 'Reset Password',
            text: 'Enter your registered email address:',
            input: 'email',
            inputPlaceholder: '',
            showCancelButton: true
        });
        if (!email) return;

        Swal.fire({ title: 'Sending OTP...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

        try {
            const normalizedEmail = email.trim().toLowerCase();
            const res = await fetch(`${API_URL}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: normalizedEmail, isReset: true })
            });
            const data = await res.json().catch(() => ({ success: false, message: 'Server returned an invalid response.' }));

            if (res.ok) {
                const { value: formValues } = await Swal.fire({
                    title: 'Verify & Reset',
                    html: '<input id="otp-v" class="swal2-input" placeholder=""><input id="pass-v" type="password" class="swal2-input" placeholder="">',
                    preConfirm: () => {
                        const otp = document.getElementById('otp-v').value.replace(/\D/g, '');
                        const newPassword = document.getElementById('pass-v').value;
                        if (otp.length !== 6) {
                            Swal.showValidationMessage('Please enter the 6 digit OTP.');
                            return false;
                        }
                        if (!newPassword || newPassword.length < 8) {
                            Swal.showValidationMessage('Password must be at least 8 characters.');
                            return false;
                        }
                        return [otp, newPassword];
                    }
                });

                if (formValues) {
                    const [otp, newPassword] = formValues;
                    const vRes = await fetch(`${API_URL}/verify-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: normalizedEmail, otp })
                    });
                    const verifyData = await vRes.json().catch(() => ({ success: false, message: 'Server returned an invalid OTP response.' }));

                    if (vRes.ok && verifyData.success) {
                        const rRes = await fetch(`${API_URL}/reset-password`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: normalizedEmail, newPassword, userType: 'user', resetToken: verifyData.resetToken })
                        });
                        const resetData = await rRes.json().catch(() => ({ success: false, message: 'Server returned an invalid reset response.' }));
                        if (rRes.ok && resetData.success) {
                            Swal.fire('Success', 'Password updated successfully. You can now login.', 'success');
                        } else {
                            Swal.fire('Error', resetData.message || 'Password reset failed.', 'error');
                        }
                    } else {
                        Swal.fire('Error', verifyData.message || 'Invalid verification code.', 'error');
                    }
                }
            } else {
                Swal.fire('Error', data.message || 'Unable to send reset OTP.', 'error');
            }
        } catch (e) {
            Swal.fire('Connection Error', `Unable to reach the server at ${API_URL}. Please check backend status and try again.`, 'error');
        }
    }

    async function sendSignupOTP() {
        const email = document.getElementById('regEmail').value.trim();
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const address = document.getElementById('regAddress').value.trim();
        const pass = document.getElementById('regPass').value;
        const dob = document.getElementById('regDOB').value;
        const village = document.getElementById('regVillage').value.trim();
        const pinCode = document.getElementById('regPinCode').value.trim();
        const hotelName = selectedRole === 'hotel' ? document.getElementById('regHotelName').value.trim() : '';

        if (!name || !email || !phone || !address || !pass || !dob || !village || !pinCode || (selectedRole === 'hotel' && !hotelName)) {
            return Swal.fire('Notice', 'Please fill in all required fields.', 'warning');
        }

        const btn = document.getElementById('regBtn');
        btn.innerText = "Sending OTP...";
        btn.disabled = true;

        const payload = {
            email: email.toLowerCase(),
            name: name,
            fullName: name,
            password: pass,
            role: selectedRole,
            phone: phone,
            address: address,
            dob: dob,
            dateOfBirth: dob,
            village: village,
            city: village,
            pinCode: pinCode,
            pincode: pinCode,
            pin: pinCode,
            hotelName: hotelName,
            experience: ''
        };

        try {
            const res = await fetch(`${API_URL}/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json().catch(() => ({ success: false, message: 'Server returned an invalid response.' }));

            if (res.ok) {
                lastEmailForOTP = email.toLowerCase();
                document.getElementById('showEmail').innerText = lastEmailForOTP;
                
                document.getElementById('signupFormPart').style.display = 'none';
                document.getElementById('signupOTPPart').style.display = 'block';
                
                startOTPTimer();
                Swal.fire('OTP Sent', 'Please check your email inbox.', 'info');
            } else {
                const errorText = (data.message || '').toLowerCase();
                if (/registered|already exists|already a member/i.test(errorText)) {
                    Swal.fire({ icon: 'info', title: 'Account Exists', text: data.message, showCancelButton: true, confirmButtonText: 'Login instead' })
                        .then((r) => { if (r.isConfirmed) showForm('login'); });
                } else {
                    Swal.fire('Error', data.message || 'Failed to process request. Please try again.', 'error');
                }
                btn.innerText = "Send OTP";
                btn.disabled = false;
            }
        } catch (e) {
            const message = e.name === 'AbortError'
                ? `Request timed out while connecting to ${API_URL}. Render may be waking up; please try again.`
                : `Unable to connect to ${API_URL}. Please check backend status and try again.`;
            Swal.fire('Connection Error', message, 'error');
            btn.innerText = "Send OTP";
            btn.disabled = false;
        }
    }

    async function verifyAndRegister() {
        const otp = document.getElementById('regOTPInput').value.replace(/\D/g, '').trim();
        
        if (!lastEmailForOTP) {
            Swal.fire('Error', 'Session validation failed. Please restart signup.', 'error');
            return;
        }

        if (otp.length !== 6) {
            Swal.fire('Error', 'Please enter the 6-digit OTP exactly as shown in your email.', 'error');
            return;
        }

        try {
            const vRes = await fetch(`${API_URL}/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: lastEmailForOTP, otp: otp })
            });
            const data = await vRes.json().catch(() => ({ success: false, message: 'Server returned an invalid response.' }));

            if (vRes.ok && data.success) {
                localStorage.setItem('userEmail', lastEmailForOTP);
                localStorage.setItem('userId', data.userId || '');
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userRole', data.role || 'guest');
                localStorage.setItem('authToken', data.sessionToken);
                if (data.profilePic) {
                    localStorage.setItem('profilePic', data.profilePic);
                    localStorage.setItem('userProfilePic', data.profilePic);
                    document.cookie = `profilePic=${encodeURIComponent(data.profilePic)}; path=/; secure; samesite=strict`;
                    window.userProfilePic = data.profilePic;
                }

                // ⭐ REDIRECTION FIXED: willClose immediately forces redirect on alert timeout/dismissal
                Swal.fire({ 
                    icon: 'success', 
                    title: 'Verified', 
                    text: 'Registration completed successfully.', 
                    timer: 1800, 
                    showConfirmButton: false,
                    willClose: () => {
                        if (data.role === 'mitra') window.location.href = "mitra-dashboard.html";
                        else if (data.role === 'hotel') window.location.href = "hotel-dashboard.html";
                        else window.location.href = "hotel.html";
                    }
                });
            } else {
                Swal.fire('Error', data.message || 'Incorrect OTP code.', 'error');
            }
        } catch (e) {
            Swal.fire('Error', e.message || 'Registration process failed.', 'error');
        }
    }

    async function handleLogin() {
        const email = document.getElementById('logEmail').value.trim().toLowerCase();
        const password = document.getElementById('logPass').value;
        try {
            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json().catch(() => ({ success: false, message: 'Server returned an invalid response.' }));
            if (res.ok) {
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userId', data.userId || '');
                localStorage.setItem('userEmail', data.email);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('authToken', data.sessionToken);
                if (data.profilePic) {
                    localStorage.setItem('profilePic', data.profilePic);
                    localStorage.setItem('userProfilePic', data.profilePic);
                    document.cookie = `profilePic=${encodeURIComponent(data.profilePic)}; path=/; secure; samesite=strict`;
                    window.userProfilePic = data.profilePic;
                }
                document.cookie = `authToken=${encodeURIComponent(data.sessionToken)}; path=/; secure; samesite=strict`;
                window.userToken = data.sessionToken;

                // ⭐ REDIRECTION FIXED: willClose immediately triggers dashboard load
                Swal.fire({ 
                    icon: 'success', 
                    title: 'Access Granted!', 
                    timer: 1000, 
                    showConfirmButton: false,
                    willClose: () => {
                        if (data.role === 'mitra') window.location.href = "mitra-dashboard.html";
                        else if (data.role === 'hotel') window.location.href = "hotel-dashboard.html";
                        else window.location.href = "hotel.html";
                    }
                });
            } else {
                Swal.fire('Error', data.message || 'Invalid security credentials!', 'error');
            }
        } catch (e) {
            const message = e.name === 'AbortError'
                ? `Login request timed out while connecting to ${API_URL}. Render may be waking up; please try again.`
                : `Unable to connect to ${API_URL}. Please check backend status and try again.`;
            Swal.fire('Connection Error', message, 'error');
        }
    }
</script>
