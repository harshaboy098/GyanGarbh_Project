<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Details | Gyan Garbh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --brand: #1e3c72;
            --brand-deep: #102847;
            --gold: #ffc107;
            --ink: #0f172a;
            --muted: #64748b;
            --paper: #ffffff;
            --line: #e2e8f0;
            --bg: #f8fafc;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
        }

        .nav-custom {
            background: var(--brand);
            border-bottom: 4px solid var(--gold);
            padding: 12px 0;
        }

        .nav-custom a { color: #fff; text-decoration: none; }

        .hero {
            min-height: 72vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            background: #0f172a center / cover no-repeat;
            color: #fff;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 0.78) 72%, rgba(15, 23, 42, 0.92) 100%);
        }

        .hero-content {
            position: relative;
            width: 100%;
            padding: 120px 0 52px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .hero h1 {
            max-width: 860px;
            margin: 18px 0 12px;
            font-size: clamp(2.4rem, 6vw, 5.2rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0;
        }

        .hero-meta {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            color: rgba(255, 255, 255, 0.88);
            font-weight: 700;
        }

        .price-panel {
            background: rgba(255, 255, 255, 0.96);
            color: var(--ink);
            border-radius: 8px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
        }

        .price-panel strong {
            display: block;
            font-size: 2rem;
            line-height: 1.1;
            color: #15803d;
        }

        .section-wrap { padding: 56px 0; }
        section[id] { scroll-margin-top: 110px; }

        .section-nav {
            position: sticky;
            top: 60px;
            z-index: 80;
            background: rgba(248, 250, 252, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.05);
            padding: 14px 0;
            margin-top: -8px;
        }

        .section-nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-weight: 700;
            text-decoration: none;
            background: #fff;
            transition: all 0.24s ease;
        }

        .section-nav-link:hover,
        .section-nav-link.active {
            color: var(--brand);
            border-color: rgba(30, 60, 114, 0.24);
            background: #eef4ff;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.08);
        }

        .section-title {
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            font-weight: 900;
            margin-bottom: 10px;
        }

        .section-kicker {
            color: var(--muted);
            max-width: 720px;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .spec-grid,
        .amenities-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        .spec-card,
        .amenity-card,
        .review-panel {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
        }

        .spec-card {
            padding: 24px;
            min-height: 150px;
        }

        .spec-icon,
        .amenity-icon {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #eef4ff;
            color: var(--brand);
            margin-bottom: 18px;
        }

        .spec-label,
        .amenity-card span {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .spec-value {
            display: block;
            margin-top: 7px;
            font-size: 1.2rem;
            font-weight: 900;
        }

        .amenity-card {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 92px;
        }

        .amenity-icon {
            margin: 0;
            flex: 0 0 46px;
            background: #fff7d6;
            color: #9a6700;
        }

        .gallery-strip {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .gallery-strip img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
            cursor: zoom-in;
            transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
        }

        .gallery-strip img:first-child {
            grid-column: span 2;
        }

        .gallery-strip img:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
            filter: saturate(1.04);
        }

        #imageModal.modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(15, 23, 42, 0.86);
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.24s ease, visibility 0.24s ease;
        }

        #imageModal.modal.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .image-modal-frame {
            position: relative;
            max-width: min(1120px, 94vw);
            max-height: 88vh;
            transform: scale(0.94);
            opacity: 0;
            transition: transform 0.26s ease, opacity 0.26s ease;
        }

        #imageModal.modal.show .image-modal-frame {
            transform: scale(1);
            opacity: 1;
        }

        .image-modal-frame img {
            display: block;
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
            background: #0f172a;
        }

        .image-modal-close {
            position: absolute;
            top: -18px;
            right: -18px;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.96);
            color: var(--ink);
            font-size: 1.8rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.24);
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .image-modal-close:hover {
            transform: scale(1.06);
            background: #fff7d6;
        }

        .room-list {
            display: grid;
            gap: 18px;
        }

        .room-card {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr) 230px;
            gap: 18px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 16px 36px rgba(15, 23, 42, 0.06);
        }

        .room-gallery-card {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            min-height: 180px;
            background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
        }

        .room-gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.28s ease;
        }

        .room-gallery-card:hover img {
            transform: scale(1.04);
        }

        .room-gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            color: var(--brand);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 2;
        }

        .room-gallery-arrow:hover {
            transform: translateY(-50%) scale(1.04);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
        }

        .room-gallery-arrow.prev-arr { left: 10px; }
        .room-gallery-arrow.next-arr { right: 10px; }

        .room-content h4 {
            margin: 0 0 8px;
            font-size: 1.2rem;
            font-weight: 900;
        }

        .room-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            background: #f8fafc;
            color: var(--brand);
            font-size: 0.74rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 12px;
        }

        .room-spec-list {
            display: grid;
            gap: 10px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .room-spec-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #334155;
            font-size: 0.95rem;
        }

        .room-spec-list i {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #f8fafc;
            color: var(--brand);
            flex-shrink: 0;
        }

        .room-package {
            border: 1px solid #e6edf6;
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(135deg, #fcfdff 0%, #f6f8fc 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 100%;
        }

        .room-package .price {
            font-size: 1.55rem;
            font-weight: 900;
            color: #15803d;
            line-height: 1.1;
        }

        .room-package .meta {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .room-book-btn {
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.03em;
            box-shadow: 0 10px 24px rgba(30, 60, 114, 0.18);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .room-book-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(30, 60, 114, 0.22);
        }

        .room-book-btn:disabled {
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #94a3b8;
        }

        .availability-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            padding: 7px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 900;
        }

        .availability-badge.available {
            background: #dcfce7;
            color: #166534;
        }

        .availability-badge.sold-out {
            background: #fee2e2;
            color: #991b1b;
        }

        .review-panel {
            padding: 30px;
            overflow: hidden;
        }

        .review-stars {
            color: var(--gold);
            font-size: 1.3rem;
            white-space: nowrap;
        }

        .review-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 24px;
        }

        .score-badge {
            min-width: 152px;
            padding: 18px;
            border-radius: 8px;
            background: var(--brand-deep);
            color: #fff;
            text-align: center;
        }

        .score-badge strong {
            display: block;
            font-size: 2.4rem;
            line-height: 1;
        }

        .rating-picker {
            display: inline-flex;
            gap: 8px;
            margin: 8px 0 16px;
            min-height: 42px;
            flex-wrap: wrap;
        }

        .rating-picker button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #cbd5e1;
            font-size: 1.25rem;
            transition: 0.18s ease;
            flex: 0 0 42px;
        }

        .rating-picker button.active,
        .rating-picker button:hover {
            color: var(--gold);
            border-color: rgba(255, 193, 7, 0.65);
            background: #fff7d6;
        }

        .review-input {
            min-height: 128px;
            width: 100%;
            resize: vertical;
            border-radius: 8px;
            border: 1px solid var(--line);
            padding: 15px;
            box-shadow: none;
        }

        .review-input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(30, 60, 114, 0.12);
        }

        .review-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
            min-height: 46px;
        }

        .review-message {
            min-height: 28px;
            font-weight: 700;
            font-size: 0.9rem;
            flex: 1 1 260px;
            overflow-wrap: anywhere;
        }

        .review-list {
            display: grid;
            gap: 12px;
            margin-top: 26px;
        }

        .review-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            background: #f8fafc;
        }

        .review-item p {
            color: #334155;
            margin: 8px 0 0;
        }

        .review-toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 1200;
            max-width: min(360px, calc(100vw - 44px));
            padding: 16px 18px;
            border-radius: 8px;
            background: #102847;
            color: #fff;
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.24);
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
            transition: 0.22s ease;
            font-weight: 800;
        }

        .review-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .state {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .state-box {
            max-width: 560px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 34px;
            box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
        }

        @media (max-width: 991px) {
            .hero { min-height: 66vh; }
            .spec-grid,
            .amenities-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .gallery-strip { grid-template-columns: 1fr; }
            .gallery-strip img:first-child { grid-column: auto; }
            .gallery-strip img { height: 220px; }
            .room-card { grid-template-columns: 1fr; }
            .room-package { min-height: auto; }
            .review-summary { align-items: flex-start; flex-direction: column; }
            .score-badge { width: 100%; }
        }

        @media (max-width: 575px) {
            .spec-grid,
            .amenities-grid { grid-template-columns: 1fr; }
            .hero-content { padding: 96px 0 34px; }
            .price-panel { margin-top: 20px; }
            .review-panel { padding: 22px; }
            .review-actions { align-items: stretch; }
            .review-actions .btn { width: 100%; }
            .image-modal-close { top: 10px; right: 10px; }
        }
    </style>
    <link rel="stylesheet" href="mobile-responsive.css">
</head>
<body>
    <nav class="navbar nav-custom sticky-top">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-4" href="hotel.html"><i class="fa-solid fa-compass text-warning me-2"></i>GYAN GARBH</a>
            <a class="fw-bold small" href="hotel.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Stays</a>
        </div>
    </nav>

    <main id="app">
        <section class="state">
            <div class="state-box">
                <div class="spinner-border text-primary mb-3" role="status" aria-hidden="true"></div>
                <h1 class="h4 fw-bold">Loading hotel details</h1>
                <p class="text-muted mb-0">Preparing the hotel details view.</p>
            </div>
        </section>
    </main>

    <div id="imageModal" class="modal" aria-hidden="true" role="dialog" aria-label="Hotel image preview">
        <div class="image-modal-frame">
            <button class="image-modal-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="imageModalImg" src="" alt="Hotel gallery preview">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        const API_URL = (window.GYAN_GARBH_API_URL || (window.location.origin && window.location.origin !== 'null' ? window.location.origin : '')).replace(/\/$/, '');
        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1800&auto=format&fit=crop';
        let currentHotel = null;
        const ADDON_FEES = { mitraAssistance: 700, pickupDrop: 1200, taxRate: 0.12 };
        let currentAvailability = null;
        let selectedReviewRating = 0;

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function getHotelId() {
            return String(new URLSearchParams(window.location.search).get('id') || '').trim();
        }

        function getAuthToken() {
            try {
                if (window.GyanGarbhApi && typeof window.GyanGarbhApi.getToken === 'function') {
                    const apiToken = String(window.GyanGarbhApi.getToken() || '').trim();
                    if (apiToken && apiToken !== 'null' && apiToken !== 'undefined') return apiToken;
                }
            } catch (error) {
                console.warn('Unable to read API helper token', error);
            }

            return String(
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                sessionStorage.getItem('authToken') ||
                sessionStorage.getItem('token') ||
                ''
            ).trim();
        }

        function getBookingSearchParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                checkIn: String(params.get('checkIn') || '').trim(),
                checkOut: String(params.get('checkOut') || '').trim(),
                guests: String(params.get('guests') || '2').trim()
            };
        }

        function calculateNights(checkIn, checkOut) {
            const inDate = new Date(`${checkIn}T00:00:00`);
            const outDate = new Date(`${checkOut}T00:00:00`);
            const nights = Math.round((outDate - inDate) / 86400000);
            return Number.isFinite(nights) && nights > 0 ? nights : 0;
        }

        function hasSelectedStayDates() {
            const { checkIn, checkOut } = getBookingSearchParams();
            return !!checkIn && !!checkOut && calculateNights(checkIn, checkOut) > 0;
        }

        async function fetchAvailability(hotelId) {
            const { checkIn, checkOut } = getBookingSearchParams();
            if (!checkIn || !checkOut || !calculateNights(checkIn, checkOut)) return null;

            const response = await fetch(`${API_URL}/api/hotels/${encodeURIComponent(hotelId)}/availability?checkIn=${encodeURIComponent(checkIn)}&checkOut=${encodeURIComponent(checkOut)}`);
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) {
                throw new Error(data.message || 'Availability could not be checked.');
            }
            return data;
        }

        async function promptForStayDates() {
            const today = new Date().toISOString().split('T')[0];
            const tomorrowDate = new Date();
            tomorrowDate.setDate(tomorrowDate.getDate() + 1);
            const tomorrow = tomorrowDate.toISOString().split('T')[0];
            const result = await Swal.fire({
                title: 'Select Stay Dates',
                html: `
                    <div class="text-start">
                        <label class="small fw-bold mb-1">Check-in</label>
                        <input type="date" id="swalCheckIn" class="form-control mb-3" min="${today}">
                        <label class="small fw-bold mb-1">Check-out</label>
                        <input type="date" id="swalCheckOut" class="form-control" min="${tomorrow}">
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Check Availability',
                didOpen: () => {
                    const inInput = document.getElementById('swalCheckIn');
                    const outInput = document.getElementById('swalCheckOut');
                    inInput.addEventListener('change', () => {
                        const minOut = new Date(`${inInput.value}T00:00:00`);
                        minOut.setDate(minOut.getDate() + 1);
                        const minOutString = minOut.toISOString().split('T')[0];
                        outInput.min = minOutString;
                        if (!outInput.value || outInput.value <= inInput.value) outInput.value = minOutString;
                    });
                },
                preConfirm: () => {
                    const checkIn = document.getElementById('swalCheckIn').value;
                    const checkOut = document.getElementById('swalCheckOut').value;
                    if (!checkIn || !checkOut || !calculateNights(checkIn, checkOut)) {
                        Swal.showValidationMessage('Please select a valid check-in and check-out date.');
                        return false;
                    }
                    return { checkIn, checkOut };
                }
            });

            if (!result.isConfirmed || !result.value) return;
            const url = new URL(window.location.href);
            url.searchParams.set('checkIn', result.value.checkIn);
            url.searchParams.set('checkOut', result.value.checkOut);
            if (!url.searchParams.get('guests')) url.searchParams.set('guests', '2');
            window.location.href = url.toString();
        }

        function isHotelVerified(hotel = {}) {
            const status = String(hotel.verificationStatus || hotel.kycStatus || '').toLowerCase();
            return hotel.isVerified === true || status === 'verified' || status === 'approved';
        }

        function verifiedBadge(hotel = {}) {
            return isHotelVerified(hotel)
                ? '<span class="badge bg-primary-subtle text-primary border border-primary-subtle fw-bold"><i class="fa-solid fa-circle-check me-1"></i>Gyan Garbh Verified</span>'
                : '';
        }

        function calculateCheckoutTotals(roomSubtotal, addons = {}) {
            const mitraFee = addons.mitraAssistance ? ADDON_FEES.mitraAssistance : 0;
            const pickupFee = addons.pickupDrop ? ADDON_FEES.pickupDrop : 0;
            const addonTotal = mitraFee + pickupFee;
            const taxAmount = Math.round((roomSubtotal + addonTotal) * ADDON_FEES.taxRate);
            return { roomSubtotal, mitraFee, pickupFee, addonTotal, taxAmount, grandTotal: roomSubtotal + addonTotal + taxAmount };
        }

        function renderCheckoutTotal(roomSubtotal, addons = {}) {
            const totals = calculateCheckoutTotals(roomSubtotal, addons);
            const target = document.getElementById('checkoutTotalBreakdown');
            if (!target) return totals;
            target.innerHTML = `
                <div class="d-flex justify-content-between"><span>Room tariff</span><strong>Rs. ${totals.roomSubtotal.toLocaleString('en-IN')}</strong></div>
                <div class="d-flex justify-content-between"><span>Mitra guide</span><strong>Rs. ${totals.mitraFee.toLocaleString('en-IN')}</strong></div>
                <div class="d-flex justify-content-between"><span>Pickup / drop</span><strong>Rs. ${totals.pickupFee.toLocaleString('en-IN')}</strong></div>
                <div class="d-flex justify-content-between"><span>Taxes</span><strong>Rs. ${totals.taxAmount.toLocaleString('en-IN')}</strong></div>
                <hr><div class="d-flex justify-content-between fs-5"><span>Total</span><strong>Rs. ${totals.grandTotal.toLocaleString('en-IN')}</strong></div>`;
            return totals;
        }
        async function verifyMockAuthorization(token, booking, order) {
            const verifyResponse = await fetch(`${API_URL}/api/payment/verify-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({
                    bookingId: booking._id,
                    razorpay_order_id: order.id,
                    razorpay_payment_id: `pay_mock_${booking._id}`,
                    razorpay_signature: 'mock-signature'
                })
            });
            const verifyData = await verifyResponse.json().catch(() => ({}));
            if (!verifyResponse.ok || verifyData.success === false) throw new Error(verifyData.message || 'Payment verification failed.');
            return verifyData;
        }

        async function authorizeBookingPayment(token, booking) {
            const orderResponse = await fetch(`${API_URL}/api/payment/create-order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                body: JSON.stringify({ bookingId: booking._id, mode: 'authorize' })
            });
            const orderData = await orderResponse.json().catch(() => ({}));
            if (!orderResponse.ok || orderData.success === false) throw new Error(orderData.message || 'Unable to start payment authorization.');
            const order = orderData.order || {};

            if (orderData.mock || !window.Razorpay) {
                return verifyMockAuthorization(token, booking, order);
            }

            return new Promise((resolve, reject) => {
                const checkout = new Razorpay({
                    key: orderData.keyId,
                    amount: order.amount,
                    currency: order.currency || 'INR',
                    name: 'Gyan Garbh',
                    description: `Stay authorization for ${booking.hotelName}`,
                    order_id: order.id,
                    prefill: { name: booking.userName || '', email: booking.userEmail || '', contact: booking.guestDetails?.phone || '' },
                    notes: { bookingId: booking._id, reference: order.receipt || booking.bookingReference || '' },
                    theme: { color: '#1e3c72' },
                    handler: async (response) => {
                        try {
                            const verifyResponse = await fetch(`${API_URL}/api/payment/verify-payment`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                                body: JSON.stringify({ bookingId: booking._id, ...response })
                            });
                            const verifyData = await verifyResponse.json().catch(() => ({}));
                            if (!verifyResponse.ok || verifyData.success === false) throw new Error(verifyData.message || 'Payment verification failed.');
                            resolve(verifyData);
                        } catch (error) {
                            reject(error);
                        }
                    },
                    modal: { ondismiss: () => reject(new Error('Payment authorization was cancelled.')) }
                });
                checkout.open();
            });
        }

        function showBookingSuccess(verification) {
            const booking = verification?.booking || {};
            const pass = verification?.pass || booking.bookingPass || {};
            return Swal.fire({
                icon: 'success',
                title: 'Booking Confirmed',
                html: `<div class="text-start"><p>Your stay is authorized and confirmed.</p><p><strong>Booking ID:</strong> ${escapeHTML(pass.reference || booking.bookingReference || booking._id || '')}</p><p class="mb-0">Digital Stay Pass is ready in My Bookings.</p></div>`,
                confirmButtonText: 'View My Bookings',
                confirmButtonColor: '#1e3c72'
            });
        }
        async function handleBookRoom(button) {
            if (!hasSelectedStayDates()) {
                promptForStayDates();
                return;
            }
            if (button?.disabled) return;

            const token = getAuthToken();
            if (!token) {
                const loginResult = await Swal.fire({
                    icon: 'warning',
                    title: 'Login Required',
                    text: 'Please login to confirm your room booking.',
                    confirmButtonText: 'Go to Login',
                    showCancelButton: true
                });
                if (loginResult.isConfirmed) window.location.href = 'login.html';
                return;
            }

            const { checkIn, checkOut, guests } = getBookingSearchParams();
            const nights = calculateNights(checkIn, checkOut);
            const roomIndex = Number(button.dataset.roomIndex || 0);
            const roomType = button.dataset.roomType || 'Signature Room';
            const roomId = button.dataset.roomId || '';
            const nightlyRate = Number(button.dataset.roomPrice || 0);
            const totalPrice = Number(button.dataset.totalPrice || (nightlyRate * nights) || 0);

            const confirmResult = await Swal.fire({
                icon: 'question',
                title: 'Prepare Booking',
                html: `
                    <div class="text-start">
                        <p class="mb-2"><strong>${escapeHTML(currentHotel?.hotelName || 'Gyan Garbh Stay')}</strong></p>
                        <p class="mb-1">Room: ${escapeHTML(roomType)}</p>
                        <p class="mb-1">Dates: ${escapeHTML(checkIn)} to ${escapeHTML(checkOut)}</p>
                        <p class="mb-3">Guests: ${escapeHTML(guests || '1')}</p>
                        <label class="d-flex gap-2 align-items-start mb-2"><input id="addonMitra" type="checkbox"> <span><strong>Add Verified Bodh Gaya Mitra</strong><br><small>Local heritage guide (+ Rs. ${ADDON_FEES.mitraAssistance.toLocaleString('en-IN')})</small></span></label>
                        <label class="d-flex gap-2 align-items-start mb-3"><input id="addonPickup" type="checkbox"> <span><strong>Airport / Railway Pickup & Drop</strong><br><small>Standard cab support (+ Rs. ${ADDON_FEES.pickupDrop.toLocaleString('en-IN')})</small></span></label>
                        <label class="small fw-bold text-muted">Remarks / arrival details</label>
                        <textarea id="addonRemarks" class="form-control mb-3" rows="2" placeholder="Train/flight details, preferred language, special requests"></textarea>
                        <div id="checkoutTotalBreakdown" class="border rounded-3 p-3 bg-light"></div>
                    </div>`,
                showCancelButton: true,
                confirmButtonText: 'Confirm Booking',
                confirmButtonColor: '#1e3c72',
                didOpen: () => {
                    const update = () => renderCheckoutTotal(totalPrice, {
                        mitraAssistance: document.getElementById('addonMitra')?.checked,
                        pickupDrop: document.getElementById('addonPickup')?.checked
                    });
                    document.getElementById('addonMitra')?.addEventListener('change', update);
                    document.getElementById('addonPickup')?.addEventListener('change', update);
                    update();
                },
                preConfirm: () => {
                    const addons = {
                        mitraAssistance: document.getElementById('addonMitra')?.checked || false,
                        pickupDrop: document.getElementById('addonPickup')?.checked || false,
                        remarks: document.getElementById('addonRemarks')?.value || ''
                    };
                    return { addons, totals: calculateCheckoutTotals(totalPrice, addons) };
                }
            });

            if (!confirmResult.isConfirmed) return;
            const checkout = confirmResult.value || { addons: {}, totals: calculateCheckoutTotals(totalPrice, {}) };

            try {
                button.disabled = true;
                button.textContent = 'Booking...';

                const response = await fetch(`${API_URL}/api/bookings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        hotelId: getHotelId(),
                        hotelName: currentHotel?.hotelName || '',
                        roomId,
                        roomIndex,
                        roomType,
                        checkIn,
                        checkOut,
                        guests: Number(guests || 1),
                        nightlyRate,
                        totalPrice,
                        price: totalPrice,
                        selectedAddons: checkout.addons,
                        pricingBreakdown: checkout.totals,
                        guestDetails: { guests: Number(guests || 1) },
                        status: 'Pending'
                    })
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok || data.success === false) {
                    throw new Error(data.message || 'Booking could not be created.');
                }

                button.textContent = 'Authorizing...';
                const verification = await authorizeBookingPayment(token, data.booking);
                await showBookingSuccess(verification);
                window.location.href = 'my-booking.html';
            } catch (error) {
                button.disabled = false;
                button.textContent = 'Book Room';
                Swal.fire('Booking Failed', error.message || 'Please try again in a moment.', 'error');
            }
        }

        function formatPrice(hotel) {
            const price = Number(hotel.acRoomPrice || hotel.nonAcRoomPrice || hotel.roomRate || 0);
            return price > 0 ? `Rs. ${price.toLocaleString('en-IN')}/Night` : 'Price on Request';
        }

        function getImages(hotel) {
            const dashboardImages = Array.isArray(hotel.images)
                ? hotel.images.map((src) => String(src || '').trim()).filter(Boolean)
                : [];
            const legacyImages = [hotel.imageUrl, hotel.imageUrl2, hotel.imageUrl3]
                .map((src) => String(src || '').trim())
                .filter(Boolean);
            const images = dashboardImages.length ? dashboardImages : legacyImages;
            return images.length ? [...new Set(images)] : [FALLBACK_IMAGE];
        }

        function getSpecs(hotel) {
            const firstRoom = Array.isArray(hotel.rooms) && hotel.rooms.length ? hotel.rooms[0] : {};
            const landmark = hotel.distanceFromLandmark || {};
            const view = landmark.landmark
                ? `${landmark.landmark} side`
                : (hotel.location || 'Bodhgaya view');

            return [
                { icon: 'fa-vector-square', label: 'Space', value: `${Number(hotel.totalRooms || 0) || 10} rooms` },
                { icon: 'fa-bed', label: 'Bed Type', value: firstRoom.roomType || (hotel.facilities?.ac ? 'AC Deluxe' : 'Standard') },
                { icon: 'fa-mountain-sun', label: 'View', value: view },
                { icon: 'fa-users', label: 'Capacity', value: firstRoom.roomsAvailable ? `${firstRoom.roomsAvailable} rooms open` : 'Family friendly' }
            ];
        }

        function getAmenities(hotel) {
            const facilities = hotel.facilities || {};
            const amenities = [
                { key: 'wifi', icon: 'fa-wifi', label: 'High Speed WiFi', active: facilities.wifi },
                { key: 'food', icon: 'fa-utensils', label: 'Food Service', active: facilities.food },
                { key: 'parking', icon: 'fa-square-parking', label: 'Parking', active: facilities.parking },
                { key: 'laundry', icon: 'fa-shirt', label: 'Laundry', active: facilities.laundry },
                { key: 'ac', icon: 'fa-snowflake', label: 'Air Conditioning', active: facilities.ac },
                { key: 'frontDesk', icon: 'fa-concierge-bell', label: 'Front Desk', active: facilities.frontDesk }
            ];
            const roomAmenities = Array.isArray(hotel.rooms)
                ? hotel.rooms.flatMap((room) => Array.isArray(room.amenities) ? room.amenities : [])
                : [];

            const mappedRoomAmenities = [...new Set(roomAmenities)].slice(0, 4).map((name) => ({
                icon: 'fa-circle-check',
                label: name,
                active: true
            }));

            return [...amenities.filter((item) => item.active), ...mappedRoomAmenities];
        }

        function getRoomImages(room, hotel) {
            const candidates = [
                room.imageUrl,
                room.imageUrl2,
                room.imageUrl3,
                ...(Array.isArray(room.images) ? room.images : []),
                hotel.imageUrl,
                hotel.imageUrl2,
                hotel.imageUrl3,
                ...(Array.isArray(hotel.images) ? hotel.images : [])
            ].filter(Boolean);
            return candidates.length ? [...new Set(candidates)] : [FALLBACK_IMAGE];
        }

        function getRoomSpecs(room, hotel) {
            const amenities = Array.isArray(room.amenities) && room.amenities.length ? room.amenities : [];
            const facilities = hotel.facilities || {};
            return [
                { icon: 'fa-wind', label: facilities.ac || room.roomType?.includes('AC') ? 'Air Conditioning' : 'Comfort Climate', value: facilities.ac || room.roomType?.includes('AC') ? 'Included' : 'Standard' },
                { icon: 'fa-bed', label: 'Bed Type', value: room.roomType?.includes('Deluxe') ? 'King Bed' : (room.roomType?.includes('Simple') ? 'Twin Bed' : 'Queen Bed') },
                { icon: 'fa-users', label: 'Max Guests', value: room.maxGuests || '2 Guests' },
                { icon: 'fa-bath', label: 'Bathroom', value: amenities.includes('Bathroom') || amenities.includes('Private Bathroom') ? 'Private Bath' : 'Shared Bath' }
            ];

        function renderStaticStars(score) {
            const rating = Number(score || 0);
            return Array.from({ length: 5 }, (_, index) => {
                const starValue = index + 1;
                if (rating >= starValue) return '<i class="fa-solid fa-star"></i>';
                if (rating >= starValue - 0.5) return '<i class="fa-solid fa-star-half-stroke"></i>';
                return '<i class="fa-regular fa-star"></i>';
            }).join('');
        }

        function formatReviewDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Just now';
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function renderReviewItems(reviews) {
            if (!Array.isArray(reviews) || reviews.length === 0) {
                return '<div class="review-item text-muted">No customer reviews yet. Be the first to rate this stay.</div>';
            }

            return reviews.slice().reverse().slice(0, 5).map((review) => `
                <article class="review-item">
                    <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
                        <div class="review-stars">${renderStaticStars(review.rating)}</div>
                        <span class="text-muted small fw-bold">${escapeHTML(formatReviewDate(review.createdAt || review.date))}</span>

                    <p class="mb-1"><strong>${escapeHTML(review.userName || 'Verified Guest')}</strong> <span class="badge bg-primary-subtle text-primary ms-1">Verified Stay</span></p><p>${escapeHTML(review.comment || '')}</p>

            `).join('');

        function updateRatingPicker(value, commit = false) {

        function showReviewToast(message) {
            const existingToast = document.getElementById('reviewToast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'reviewToast';
            toast.className = 'review-toast';

            requestAnimationFrame(() => toast.classList.add('show'));

        function initRoomGalleryControls() {
            document.querySelectorAll('.room-gallery-arrow').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();

                    const galleryCard = button.closest('.room-gallery-card');
                    const imageEl = galleryCard?.querySelector('img');
                    if (!imageEl) return;

                    const images = button.dataset.images ? JSON.parse(button.dataset.images) : [];
                    if (!images.length) return;

                    const currentIndex = Number(imageEl.dataset.index || 0);
                    const step = button.classList.contains('next-arr') ? 1 : -1;
                    const nextIndex = (currentIndex + step + images.length) % images.length;
                    imageEl.src = images[nextIndex];
                    imageEl.dataset.index = String(nextIndex);
                });
            });
        }

            const modal = document.getElementById('imageModal');
            const closeButton = modal?.querySelector('.image-modal-close');

            closeButton.addEventListener('click', closeImageModal);
            modal.addEventListener('click', (event) => {
                if (event.target === modal) closeImageModal();

                setReviewMessage('Please write a short review comment.', 'warning');
                return;

                submitButton.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin me-2"></i>Submitting';

                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

                    <div class="container">
                        <h2 class="section-title">Hotel Details & Specification</h2>
                        <p class="section-kicker">${escapeHTML(hotel.description || 'A refined stay experience for Bodhgaya visitors, designed around comfort, clarity, and trusted local support.')}</p>
                        <div class="spec-grid">
                            ${specs.map((spec) => `
                                <article class="spec-card">
                                    <div class="spec-icon"><i class="fa-solid ${escapeHTML(spec.icon)}"></i></div>
                                    <span class="spec-label">${escapeHTML(spec.label)}</span>
                                    <strong class="spec-value">${escapeHTML(spec.value)}</strong>
                                </article>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <section id="rooms" class="section-wrap pt-0">
                    <div class="container">
                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                            <div>
                                <h2 class="section-title mb-1">Rooms & Suites</h2>
                                <p class="section-kicker mb-0">Choose from a curated set of room categories tailored to spiritual journeys and premium comfort.</p>
                            </div>
                        </div>
                        <div class="room-list">
                            ${(Array.isArray(hotel.rooms) && hotel.rooms.length ? hotel.rooms : [{ roomType: 'Signature Room', price: hotel.acRoomPrice || hotel.nonAcRoomPrice || 1800, amenities: ['Air Conditioning', 'Private Bathroom'], images: [] }]).map((room, index) => {
                                const roomImages = getRoomImages(room, hotel);
                                const roomSpecs = getRoomSpecs(room, hotel);
                                const roomPrice = Number(room.price || hotel.acRoomPrice || hotel.nonAcRoomPrice || 1800);
                                const totalPrice = selectedNights ? roomPrice * selectedNights : 0;
                                const breakfastLabel = room.breakfastIncluded || hotel.facilities?.food ? 'Breakfast Included' : 'Breakfast Available';
                                const roomTypeLabel = room.roomType || 'Signature Room';
                                const roomId = String(room._id || room.id || index);
                                const roomBadge = room.roomType?.includes('AC') ? 'Air Conditioned' : (room.roomType?.includes('Deluxe') ? 'Deluxe Comfort' : 'Premier Stay');
                                const imagesAttr = `data-images='${JSON.stringify(roomImages).replace(/'/g, "\\'")}'`;
                                const availabilityBadge = hasDates
                                    ? `<span class="availability-badge ${isSoldOut ? 'sold-out' : 'available'}">${isSoldOut ? 'Sold Out for selected dates' : 'Available for selected dates'}</span>`
                                    : '<span class="availability-badge available">Select dates to check availability</span>';
                                const totalMeta = hasDates
                                    ? `<div class="meta fw-bold text-dark">${selectedNights} night${selectedNights === 1 ? '' : 's'} total: Rs. ${totalPrice.toLocaleString('en-IN')}</div>`
                                    : '<div class="meta">Pick check-in and check-out dates to see total price.</div>';
                                return `
                                    <article class="room-card">
                                        <div class="room-gallery-card">
                                            <button type="button" class="room-gallery-arrow prev-arr" ${imagesAttr} aria-label="Previous room image"><i class="fas fa-chevron-left"></i></button>
                                            <button type="button" class="room-gallery-arrow next-arr" ${imagesAttr} aria-label="Next room image"><i class="fas fa-chevron-right"></i></button>
                                            <img src="${escapeHTML(roomImages[0])}" alt="${escapeHTML(roomTypeLabel)}" data-index="0" loading="lazy" onerror="this.src='${FALLBACK_IMAGE}'">
                                        </div>
                                        <div class="room-content">
                                            <div class="room-badge"><i class="fas fa-star"></i>${escapeHTML(roomBadge)}</div>
                                            <h4>${escapeHTML(roomTypeLabel)}</h4>
                                            <p class="text-muted mb-3">${escapeHTML(room.description || 'A calm, curated retreat crafted for rest, privacy, and effortless comfort.')}</p>
                                            <ul class="room-spec-list">
                                                ${roomSpecs.map((spec) => `<li><i class="fas ${escapeHTML(spec.icon)}"></i><span><strong>${escapeHTML(spec.label)}:</strong> ${escapeHTML(spec.value)}</span></li>`).join('')}
                                            </ul>
                                        </div>
                                        <div class="room-package">
                                            <div class="price">Ã¢â€šÂ¹${roomPrice.toLocaleString('en-IN')}</div>
                                            <div class="meta">Per night Ã¢â‚¬Â¢ ${escapeHTML(breakfastLabel)}</div>
                                            <div class="meta">${escapeHTML(room.roomsAvailable ? `${room.roomsAvailable} room available` : 'Flexible booking window')}</div>
                                            ${availabilityBadge}
                                            ${totalMeta}
                                            <button type="button" class="room-book-btn" onclick="handleBookRoom(this)" data-room-index="${index}" data-room-id="${escapeHTML(roomId)}" data-room-type="${escapeHTML(roomTypeLabel)}" data-room-price="${roomPrice}" data-total-price="${totalPrice}" ${isSoldOut ? 'disabled' : ''}>${isSoldOut ? 'Sold Out' : 'Book Room'}</button>
                                        </div>
                                    </article>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </section>

                <section id="amenities" class="section-wrap pt-0">
                    <div class="container">
                        <h2 class="section-title">Amenities</h2>
                        <p class="section-kicker">${escapeHTML(hotel.gyanGarbhHighlights || 'Essential facilities for a smooth stay, surfaced from verified hotel information.')}</p>
                        <div class="amenities-grid">
                            ${(amenities.length ? amenities : [{ icon: 'fa-circle-check', label: 'Verified Stay' }]).map((item) => `
                                <article class="amenity-card">
                                    <div class="amenity-icon"><i class="fa-solid ${escapeHTML(item.icon)}"></i></div>
                                    <span>${escapeHTML(item.label)}</span>
                                </article>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <section class="section-wrap pt-0">
                    <div class="container">
                        <h2 class="section-title">Gallery</h2>
                        <div id="gallery-container" class="gallery-strip">
                            ${images.map((src, index) => `<img src="${escapeHTML(src)}" alt="${escapeHTML(hotel.hotelName || 'Hotel image')} ${index + 1}" loading="lazy" onerror="this.remove()">`).join('')}
                        </div>
                    </div>
                </section>

                <section id="reviews" class="section-wrap pt-0">
                    <div class="container">
                        <div class="review-panel">
                            <div class="review-summary">
                                <div>
                                    <h2 class="section-title mb-2">Customer Ratings & Reviews</h2>
                                    <p class="text-muted mb-0">Only completed Gyan Garbh bookings can publish Verified Stay reviews.</p>
                                </div>
                                <div class="score-badge">
                                    <strong>${escapeHTML(rating)}</strong>
                                    <div class="review-stars my-2">${renderStaticStars(rating)}</div>${renderCategoryBreakdown(hotel.categoryRatings || hotel.gvs?.categoryBreakdown || {})}
                                    <span class="small fw-bold">${escapeHTML(totalReviews)} verified review${totalReviews === 1 ? '' : 's'}</span>
                                </div>
                            </div>

                            <div class="alert alert-info mb-4"><strong>Verified reviews unlock after checkout.</strong> Open My Bookings after your stay is completed to write a category-wise review.</div><form id="reviewForm" style="display:none">
                                <label class="fw-bold mb-1" for="ratingPicker">Your Rating</label>
                                <div id="ratingPicker" class="rating-picker" aria-label="Choose a rating from 1 to 5">
                                    ${[1, 2, 3, 4, 5].map((value) => `<button type="button" data-rating="${value}" aria-label="${value} star"><i class="far fa-star"></i></button>`).join('')}
                                </div>
                                <label class="fw-bold mb-2" for="reviewComment">Your Review</label>
                                <textarea id="reviewComment" class="form-control review-input" maxlength="1000" placeholder="Tell guests about cleanliness, location, service, comfort, or anything that made the stay special."></textarea>
                                <div class="review-actions">
                                    <div id="reviewMessage" class="review-message text-muted"></div>
                                    <button id="submitReviewButton" class="btn btn-primary rounded-pill px-4 fw-bold" type="submit">
                                        <i class="fa-solid fa-paper-plane me-2"></i>Submit Review
                                    </button>
                                </div>
                            </form>

                            <div class="review-list" id="reviewList">
                                ${renderReviewItems(hotel.reviews)}
                            </div>
                        </div>
                    </div>
                </section>`;
            initReviewForm();
            initGalleryLightbox();
            initRoomGalleryControls();
        }

        async function loadHotelDetails() {
            const id = getHotelId();
            if (!id) {
                renderError('Missing hotel id in the page URL.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/hotels/${encodeURIComponent(id)}`);
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) {
                    throw new Error(data.message || 'Hotel details could not be loaded.');
                }
                currentAvailability = await fetchAvailability(id);
                renderHotel(data.hotel || data);
            } catch (error) {
                renderError(error.message || 'Server unavailable. Please try again.');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initImageModalControls();
            loadHotelDetails();
        });
    </script>
    <script src="mobile-responsive.js"></script>
</body>
</html>
